<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 预渲染主题脚本: 首屏前设置 html.dark, 避免亮暗闪烁 (FOUC)。
      // 默认暗色; 用户切过亮色后 (localStorage tf-theme=light) 保持亮色。
      (function () {
        try {
          if (localStorage.getItem('tf-theme') !== 'light') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- /assets 由生产后端直接提供；根目录图标路径会被 SPA 回退成 HTML。 -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/stockfund-icon-v1.svg" />
    <meta name="theme-color" content="#8B5CF6" />
    <title>stockfund-panel · 股票与基金看板</title>
    <!-- 本地字体 + swap: 首页无需等待境外字体样式或字体下载。 -->
    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  </head>
  <body class="bg-base text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
