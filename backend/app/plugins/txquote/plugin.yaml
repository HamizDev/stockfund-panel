# txquote — 腾讯/新浪免费行情插件
# 无需 API Key (runtime: none)。提供分钟K与五档盘口, 补齐免费数据源能力。
# 数据源: 腾讯 qt.gtimg.cn (五档盘口/分时) + 腾讯 mkline (ETF 分钟 OHLC) + 新浪 quotes.sina.cn (股票分钟K)。
# 注意: 均为页面级公开接口, 非官方 API, 结构变化时插件会软失败(返回空)而非抛错。

name: txquote
display_name: "txquote"
runtime: none
entry: app.plugins.txquote.provider:TxQuoteProvider
check: app.plugins.txquote.provider:availability
datasets: [minute, depth5]
description: "腾讯/新浪公开行情: 五档盘口(腾讯 q=, 买1-5/卖1-5, 量为手)、股票分钟K(腾讯1m与新浪5/15/30/60m)、沪深ETF原生分钟OHLC(腾讯1/5/15/30/60m, 不复权, 每次最多320根)。ETF分钟成交额不可用(amount为空), 不以换手率或价量乘积代替。无需Key; 公开页面接口的可用性可能变化。"
install_hint: "无需安装, 直接可用"
homepage: "https://qt.gtimg.cn"
