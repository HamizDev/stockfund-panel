# Optional BaoStock factor source with a selected-symbol raw daily fallback.
name: baostock
display_name: "BaoStock"
runtime: python
entry: app.plugins.baostock.provider:BaoStockProvider
check: app.plugins.baostock.provider:availability
datasets: [adj_factor]
description: "BaoStock 免费沪深股票复权因子；分析页已选股票/ETF可使用只读原始日线备选，不提供分钟线。"
install_hint: "在数据源设置中安装插件依赖 baostock，或在 backend 目录安装 app/plugins/baostock/requirements.txt。"
homepage: "https://www.baostock.com/"
