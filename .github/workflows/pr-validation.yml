name: PR validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install uv
        run: python -m pip install uv==0.12.19
      - name: Run locked backend suite
        working-directory: backend
        env:
          PYTHONFAULTHANDLER: '1'
        run: |
          uv sync --frozen --extra dev
          uv run --frozen pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install -g pnpm@9
          pnpm install --frozen-lockfile
          pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image without publishing
        run: docker build --build-arg USE_CN_MIRROR=0 -t stockfund-panel:pr .
